<style>

.about-content h1 {

.biography-text {

}

}

.about-links a {
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--fg-dim);

  border-bottom: 1px solid transparent;
  transition: border-color 0.2s ease;
}

.about-links a:hover {
  border-bottom-color: var(--line-strong); /* Soulignement fin au survol */
  color: var(--fg);
}

/* Version Mobile */
@media (max-width: 768px) {
  .about-container {
    grid-template-columns: 1fr; /* Tout passe sur une seule colonne */
    margin: 2rem auto;
  }
}
